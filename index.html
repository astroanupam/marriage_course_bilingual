<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marriage Analysis Course</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3b3a8c">
<style>
  :root { --bg:#f6f6fb; --card:#fff; --ink:#1f1f2e; --muted:#6b6b80; --accent:#3b3a8c; --gold:#9c630f; --ongold:#fff; --line:#e1e1ec; --hdr:#3b3a8c; --good:#237a4d; --bad:#c0392b; --tint:#eeedf8; --fs:16px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141c; --card:#1d1d29; --ink:#ececf5; --muted:#9a9ab0; --accent:#8f8df5; --gold:#e8a35c; --ongold:#1b1208; --line:#2e2e40; --hdr:#2a2960; --good:#4cc38a; --bad:#ff7b6b; --tint:#26263a; }
  }
  * { box-sizing:border-box; }
  html { font-size:var(--fs); }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column; line-height:1.55; }
  header { background:var(--hdr); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  #pill { background:var(--gold); color:var(--ongold); border-radius:12px; padding:2px 10px; font-size:13px; white-space:nowrap; }
  #menuBtn { display:none; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:290px; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside input { margin:10px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:15px; }
  #list { overflow:auto; flex:1; }
  #list .grp { padding:12px 14px 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  #list .it { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; align-items:center; gap:8px; }
  #list .it.active { background:var(--bg); border-left:4px solid var(--accent); font-weight:600; padding-left:10px; }
  #list .it .nm { flex:1; min-width:0; }
  #list .it small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
  #list .tick { color:var(--good); font-weight:700; width:18px; text-align:center; }
  #list .pct { color:var(--muted); font-size:12px; }
  section#view { flex:1; min-width:0; overflow:auto; padding:20px; }
  main { min-width:0; }
  .page { max-width:820px; margin:0 auto 20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .page.wide { max-width:1040px; }
  .page h1, .page h2, .page h3 { color:var(--accent); margin:1em 0 .4em; line-height:1.25; }
  .page h1 { margin-top:.2em; font-size:1.6rem; }
  .page h2 { font-size:1.35rem; }
  .page h3 { font-size:1.12rem; color:var(--gold); }
  .page h4 { margin:1em 0 .3em; font-size:1rem; color:var(--muted); font-style:italic; }
  .page p { margin:.55em 0; }
  .page ul, .page ol { padding-left:1.3em; margin:.5em 0; }
  .page li { margin:.25em 0; }
  .crumb { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .crumb a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .tw { overflow-x:auto; margin:.8em 0; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  caption { text-align:left; font-weight:700; color:var(--accent); padding:8px 10px; caption-side:top; }
  th { background:var(--accent); color:#fff; text-align:left; padding:8px 10px; font-weight:600; white-space:nowrap; }
  @media (prefers-color-scheme: dark) { th { background:#34336f; } }
  td { padding:7px 10px; border-top:1px solid var(--line); vertical-align:top; min-width:60px; }
  tr:nth-child(even) td { background:var(--tint); }
  mark.ph { background:#ffe08a; color:#000; border-radius:3px; padding:0 3px; }
  mark.hit { background:#ffe08a; color:#000; border-radius:3px; }
  .callout { border-left:5px solid var(--cc,#3b6ea8); background:var(--cb,#e8f1fb); border-radius:8px; padding:10px 14px; margin:.9em 0; }
  .callout .lb { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--cc,#3b6ea8); margin-bottom:2px; }
  .callout p { margin:.35em 0; }
  .callout.NOTE { --cc:#3b6ea8; --cb:#e8f1fb; } .callout.TIP { --cc:#237a4d; --cb:#e8f5ec; } .callout.WARNING { --cc:#c0392b; --cb:#fdecea; }
  .callout.EXAMPLE { --cc:#c8731d; --cb:#fff4e0; } .callout.REMEMBER { --cc:#3b3a8c; --cb:#eeedf8; } .callout.TEACHING { --cc:#a97c0b; --cb:#fff9db; } .callout.APP { --cc:#3f3fb5; --cb:#e6e9ff; }
  @media (prefers-color-scheme: dark) {
    .callout { background:var(--tint); color:var(--ink); }
    .callout.NOTE { --cc:#7fb0e8; } .callout.TIP { --cc:#4cc38a; } .callout.WARNING { --cc:#ff7b6b; } .callout.EXAMPLE { --cc:#f0a45a; } .callout.REMEMBER { --cc:#a9a7ff; } .callout.TEACHING { --cc:#e5c25a; } .callout.APP { --cc:#9a9aff; }
  }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; align-items:center; }
  .bar button, button.b { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:9px 13px; font-size:14px; cursor:pointer; font-family:inherit; }
  .bar button.primary, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (prefers-color-scheme: dark) { .bar button.primary, button.primary { background:#4a49b8; border-color:#4a49b8; } }
  .bar button.danger, button.danger { color:var(--bad); }
  button:disabled { opacity:.45; cursor:default; }
  .bar .sp { flex:1; }
  .hint, .note { color:var(--muted); font-size:13px; margin-top:6px; }
  .back { margin-top:22px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  textarea, input.tx, select.tx, input.num { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  select.tx, input.num { width:auto; padding:7px 8px; }
  input.num { width:64px; }
  .hero { background:linear-gradient(135deg,var(--hdr),#5a3a8c); color:#fff; border-radius:12px; padding:22px; margin-bottom:16px; }
  .hero h1, .hero h2 { color:#fff; margin:.1em 0 .2em; font-size:1.55rem; }
  .hero p { margin:.3em 0; opacity:.92; }
  .hero .bar button { background:rgba(255,255,255,.18); color:#fff; border-color:transparent; }
  .hero .bar button.primary { background:var(--gold); color:var(--ongold); }
  .prog { height:9px; background:rgba(127,127,160,.25); border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .prog i { display:block; height:100%; background:var(--gold); border-radius:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:12px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card h4 { margin:0 0 4px; color:var(--accent); font-style:normal; font-size:.98rem; }
  .card .meta { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .card.done { border-left:5px solid var(--good); }
  .chip { display:inline-block; background:var(--gold); color:var(--ongold); border-radius:12px; padding:2px 10px; font-size:12px; }
  .lessons .les { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin:6px 0; cursor:pointer; background:var(--card); }
  .lessons .les:hover { border-color:var(--accent); }
  .lessons .les .n { width:28px; height:28px; border-radius:50%; background:var(--tint); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; }
  .lessons .les.seen .n { background:var(--good); color:#fff; }
  .lessons .les .t { flex:1; }
  .lessons .les .tag { font-size:11px; color:var(--muted); }
  .res { border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:10px; padding:10px 14px; margin:8px 0; cursor:pointer; background:var(--card); }
  .res b.t { color:var(--accent); }
  .res .where { font-size:12px; color:var(--muted); }
  .res .snip { font-size:.92rem; color:var(--ink); margin-top:4px; }
  .q { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0; background:var(--card); }
  .q .stem { font-weight:600; margin-bottom:8px; }
  .q .opt { display:block; width:100%; text-align:left; margin:5px 0; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:.95rem; cursor:pointer; font-family:inherit; }
  .q .opt:hover:not(:disabled) { border-color:var(--accent); }
  .q .opt:disabled { opacity:1; cursor:default; }
  .q .opt:disabled:not(.ok):not(.no) { opacity:.6; }
  .q .opt.sel { border-color:var(--accent); background:var(--tint); }
  .q .opt.ok { border-color:var(--good); background:rgba(35,122,77,.14); } .q .opt.ok::after { content:'  \2713 correct answer'; font-weight:700; color:var(--good); } .q .opt.no::after { content:'  \2717 your answer'; font-weight:700; color:var(--bad); }
  .q .opt.no { border-color:var(--bad); background:rgba(192,57,43,.13); }
  .q .why { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--tint); font-size:.92rem; }
  .q .why b.r { color:var(--good); } .q .why b.w { color:var(--bad); }
  .score { font-size:1.4rem; font-weight:700; color:var(--accent); }
  .flash { max-width:520px; margin:16px auto; min-height:220px; background:var(--card); border:2px solid var(--accent); border-radius:16px; padding:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; font-size:1.05rem; }
  .flash .term { font-size:1.45rem; font-weight:700; color:var(--accent); }
  .flash .src { margin-top:10px; font-size:12px; color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-right:1px solid var(--line); background:var(--bg); color:var(--ink); padding:7px 12px; font-size:14px; cursor:pointer; font-family:inherit; }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--accent); color:#fff; }
  .frow { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .frow .fl { width:150px; font-weight:600; }
  .frow .fh { flex:1; min-width:180px; font-size:12px; color:var(--muted); }
  .tot { background:var(--tint); border-radius:10px; padding:12px 14px; margin:12px 0; }
  .band { font-weight:700; color:var(--accent); }
  .row2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr)); gap:14px; }
  .lab-row { display:flex; gap:8px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  .lab-row .ln { width:92px; font-weight:600; }
  details.d { border:1px solid var(--line); border-radius:10px; margin:10px 0; background:var(--card); }
  details.d > summary { padding:11px 14px; cursor:pointer; font-weight:600; color:var(--accent); }
  details.d > div { padding:0 14px 12px; }
  .chart { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-rows:minmax(74px,auto); width:min(100%,430px); margin:12px auto; border:3px solid var(--accent); background:var(--card); }
  .chart .cs { border:1px solid var(--accent); padding:3px 5px; font-size:13px; min-height:74px; min-width:0; overflow-wrap:anywhere; }
  .chart .cs small { display:block; font-size:9px; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
  .chart .cs b { display:block; line-height:1.25; }
  .chart .cs.asc { background:rgba(200,137,43,.22); }
  .chart .cc { grid-area:2/2/4/4; background:var(--tint); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6px; border:1px solid var(--accent); }
  .chart .cc b { color:var(--accent); font-size:13px; } .chart .cc span { font-size:11px; color:var(--muted); }
  .ok-t { color:var(--good); font-weight:600; } .bad-t { color:var(--bad); font-weight:600; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; border-radius:4px; }
  h1:focus { outline:none; }
  #srchBtn { display:none; }
  .lnk { color:var(--accent); text-decoration:underline; cursor:pointer; }
  .q .seg { display:inline-flex; margin:2px 0 6px; }
  .tot .bar { margin-top:8px; }
  kbd { background:var(--tint); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:.85em; }
  #langBtn { white-space:nowrap; font-weight:600; }
  header h1 { min-width:0; }
  @media (max-width:760px) {
    header { padding:8px 10px; gap:6px; }
    header button { padding:8px 9px; }
    #langBtn { padding:8px 8px; font-size:13px; }
    #menuBtn, #srchBtn { display:inline-block; }
    aside { position:fixed; top:52px; bottom:0; left:0; z-index:5; transform:translateX(-100%); transition:.2s; width:84%; max-width:340px; }
    aside.open { transform:none; box-shadow:0 0 30px rgba(0,0,0,.4); }
    section#view { padding:10px; }
    .page { padding:15px; }
    .frow .fl { width:100%; }
  }
  @media (max-width:380px) { #pill { display:none; } header h1 { font-size:16px; } }
  @media (max-width:430px) { html[lang=hi] #pill { display:none; } }
  html[lang=hi] i, html[lang=hi] em, html[lang=hi] .page h4, html[lang=hi] .hero p { font-style:normal; }   /* Devanagari has no true italic: a slanted one breaks the headline stroke */
  html[lang=hi] i, html[lang=hi] em { text-decoration:underline dotted; text-underline-offset:3px; }
  html[lang=hi] .hero i, html[lang=hi] .prog i { text-decoration:none; }
  /* Hindi (html lang="hi"): Devanagari font stack, more line height, no letter-spacing or capitals, wrapping labels */
  html[lang=hi] body, html[lang=hi] button, html[lang=hi] input, html[lang=hi] select, html[lang=hi] textarea { font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,Segoe UI,Roboto,sans-serif; }
  html[lang=hi] body { line-height:1.75; }
  html[lang=hi] th { white-space:normal; }
  html[lang=hi] td { min-width:0; }
  html[lang=hi] .hero .kick, html[lang=hi] #list .grp, html[lang=hi] .callout .lb, html[lang=hi] .chart .cs small { letter-spacing:0; text-transform:none; }
  html[lang=hi] .chart .cs small { font-size:11px; }
  html[lang=hi] .page h1, html[lang=hi] .page h2, html[lang=hi] .page h3 { line-height:1.5; }
  html[lang=hi] #list .grp { font-size:13px; }
  html[lang=hi] .bar button, html[lang=hi] button.b, html[lang=hi] .seg button { white-space:normal; line-height:1.5; max-width:100%; }
  html[lang=hi] .seg { flex-wrap:wrap; max-width:100%; }
  html[lang=hi] #langBtn { font-size:14px; line-height:1.4; }
  html[lang=hi] .q .opt { line-height:1.6; }
  html[lang=hi] .q .opt.ok::after { content:'  \2713 सही उत्तर'; }
  html[lang=hi] .q .opt.no::after { content:'  \2717 आपका उत्तर'; }
  html[lang=hi] .frow .fl { width:170px; }
  html[lang=hi] .card .meta { flex-wrap:wrap; }
  html[lang=hi] .page, html[lang=hi] .card, html[lang=hi] .les .t, html[lang=hi] .q, html[lang=hi] .res { overflow-wrap:break-word; }
  @media (max-width:760px) { html[lang=hi] .frow .fl { width:100%; } }
  @media print { .tw { overflow:visible; } th { white-space:normal; } .hero { background:none; color:#000; } .hero h1, .hero h2 { color:#000; } tr { break-inside:avoid; } header, aside, .bar, .noprint { display:none !important; } body { height:auto; display:block; } section#view { overflow:visible; } .page { border:0; } }
  @media (prefers-color-scheme: dark) { .seg button.on { background:#4a49b8; } .lessons .les.seen .n { background:#1f7a50; } .res { border-left-color:var(--gold); } }

</style>

<!-- The visible words in this shell are set by app.js through t() (see shellText); the English below is only the fallback. -->
<header>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <h1>🕉 Marriage Analysis</h1>
  <button id="srchBtn" aria-label="Search">🔍</button>
  <span id="pill" title="Modules complete"></span>
  <button id="langBtn" aria-label="Switch to Hindi" lang="hi">हिंदी</button>
  <button id="moreBtn" aria-label="More">⋮</button>
</header>
<main>
  <aside id="side">
    <input id="search" placeholder="Search the whole course…" aria-label="Search">
    <div id="list"></div>
  </aside>
  <section id="view"></section>
</main>
<input type="file" id="importFile" accept=".json" hidden>
<script src="content.js" charset="utf-8"></script>
<script>

</script>

window.I18N_HI = window.I18N_HI || {};
const SKEY = 'marriagecourse.v2';
const nint = (v, a, b, d) => { v = Math.round(+v); return isFinite(v) ? Math.max(a, Math.min(b, v)) : d; };
const isoDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
// Make any stored or imported state safe: right shapes, numbers as numbers, no stray markup in numeric fields.
function normState(d) {
  const o = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
  ['seen', 'quiz', 'marks', 'notes', 'known', 'score', 'sheetA', 'lab'].forEach(k => { if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) o[k] = {}; });
  o.fs = nint(o.fs, 13, 24, 16);
  o.lang = o.lang === 'hi' ? 'hi' : 'en';
  Object.keys(o.quiz).forEach(k => { const r = o.quiz[k]; if (!r || typeof r !== 'object') { delete o.quiz[k]; return; } o.quiz[k] = { best: nint(r.best, 0, 99, 0), last: nint(r.last, 0, 99, 0), tries: nint(r.tries, 0, 9999, 0), ts: nint(r.ts, 0, 9e15, 0) }; });
  if (o.sheetA.best != null) o.sheetA = { best: nint(o.sheetA.best, 0, 30, 0), last: nint(o.sheetA.last, 0, 30, 0), ts: nint(o.sheetA.ts, 0, 9e15, 0) };
  const L = o.lab;
  if (L.d9) L.d9 = { s: nint(L.d9.s, 0, 11, 9), d: nint(L.d9.d, 0, 29, 0), m: nint(L.d9.m, 0, 59, 0) };
  if (L.dasha) L.dasha = { s: nint(L.dasha.s, 0, 11, 7), d: nint(L.dasha.d, 0, 29, 0), m: nint(L.dasha.m, 0, 59, 0), birth: isoDate(L.dasha.birth), md: String(L.dasha.md || '').replace(/[^A-Za-z]/g, '') };
  if (L.lens != null) L.lens = nint(L.lens, 0, 11, 0);
  L.gq = String(L.gq || '');
  const c = L.chart;
  if (c && typeof c === 'object' && c.asc && c.pos) {
    const pt = x => ({ s: nint(x && x.s, 0, 11, 0), d: nint(x && x.d, 0, 29, 0), m: nint(x && x.m, 0, 59, 0) });
    const pos = {}; ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu'].forEach(p => pos[p] = pt(c.pos[p]));
    L.chart = { name: String(c.name || '').slice(0, 80), gender: c.gender === 'Female' ? 'Female' : 'Male', birth: isoDate(c.birth), asc: pt(c.asc), pos, mdSel: String(c.mdSel || '').replace(/[^A-Za-z]/g, ''), ages: String(c.ages || '').replace(/[^0-9 ,;.]/g, '').slice(0, 60) };

let FL = null;
const KPRE = LANG === 'hi' ? 'hi:' : '';   // the "known" marks are kept apart for each language
function termList(scope) {
  const cards = [], seen = new Set(), mm = /^m(\d+)$/.exec(scope || '');
  const addRows = (rows, src) => rows.slice(1).forEach(r => {
    const term = plain(r[0] || '').trim(); if (!term || !r[1]) return;
    const id = KPRE + term.toLowerCase(); if (seen.has(id)) return; seen.add(id);
    cards.push({ id, term, mean: r[1], src });
  });
  UNITS.forEach(u => {
    if (mm && !(u.kind === 'module' && u.n === +mm[1])) return;   // a module deck holds exactly that module's Key Terms
    if (u.kind === 'module' || u.kind === 'intro') u.lessons.filter(l => l.en.title === 'Key Terms').forEach(l => parseMd(l.md).filter(b => b.t === 'table').forEach(tb => addRows(tb.rows, u.kind === 'module' ? t('Module {n}', { n: u.n }) : t('Introduction'))));
    if (u.kind === 'glossary' && !mm && (LANG === 'en' || u.hiLoaded)) u.lessons.forEach(l => parseMd(l.md).filter(b => b.t === 'table').forEach(tb => addRows(tb.rows.map(r => [r[0], r[1]]), t('Glossary'))));
  });
  return cards;
}

// ---------- search ----------
let SIDX = null;
function buildIdx() {
  const flat = md => plain(md.replace(/<br>/g, ' ').replace(/^\|?[-:| ]+\|?$/gm, ' ').replace(/[|>#]/g, ' ').replace(/:::chart|:::|\[[A-Z]+\]/g, ' ')).replace(/\s+/g, ' ');
  // in Hindi the English lesson text is added for matching only, so a learner can also search 'venus' or 'dasha'
  SIDX = ALL_LESSONS.map(l => { const raw = flat(l.md); const extra = LANG === 'hi' && l.en && l.en.md !== l.md ? ' ' + flat(l.en.md) : ''; return { l, t: plain(l.title).toLowerCase() + (extra ? ' ' + plain(l.en.title).toLowerCase() : ''), raw, low: (raw + extra).toLowerCase() }; });
}
function hlText(txt, terms) {
  const re = new RegExp('(' + terms.slice().sort((a, b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return txt.split(re).map((s, i) => i % 2 ? '<mark class="hit">' + esc(s) + '</mark>' : esc(s)).join('');
}
function searchHtml(q) {
  if (!SIDX) buildIdx();
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const res = SIDX.map(x => {
    const hay = x.t + ' ' + x.low; if (!terms.every(tm => hay.includes(tm))) return null;
    let sc = 0, cnt = 0; terms.forEach(tm => { if (x.t.includes(tm)) sc += 40; cnt += x.low.split(tm).length - 1; });
    sc += Math.min(60, 12 * cnt / Math.max(1, x.low.length / 1000));   // mentions per 1,000 characters: a lesson about the topic beats a long lesson that merely mentions it
    return { x, sc };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc);
  const qv = { n: res.length, q: esc(q) };
  let h = `<div class="page"><h1>${t('Search')}</h1><p class="note">${res.length > 40 ? t('{n} lessons match “{q}” (showing the best 40).', qv) : res.length === 1 ? t('{n} lesson match “{q}”.', qv) : t('{n} lessons match “{q}”.', qv)}</p>`;
  res.slice(0, 40).forEach(r => {
    const x = r.x, p = x.low.indexOf(terms[0]), sn = hlText(p >= 0 && p < x.raw.length ? x.raw.slice(Math.max(0, p - 70), p + 130) : x.raw.slice(0, 160), terms);
    h += `<div class="res" data-act="go" data-q="${esc(q)}" data-to="#/u/${x.l.unit.id}/${x.l.i}"><b class="t">${inline(x.l.title)}</b><div class="where">${esc(fullTitle(x.l.unit))}</div><div class="snip">${p > 70 ? '…' : ''}${sn}…</div></div>`;
  });
  return h + '</div>';
}

  if (tg && !['BUTTON', 'SELECT', 'INPUT', 'TEXTAREA'].includes(tg.tagName) && tg.hasAttribute('tabindex')) { e.preventDefault(); tg.click(); }
});
$('list').addEventListener('click', e => { const tg = e.target.closest('[data-act="go"]'); if (tg) { lastQuery = ''; go(tg.dataset.to); } });
$('menuBtn').onclick = () => $('side').classList.toggle('open');
$('srchBtn').onclick = () => { $('side').classList.add('open'); $('search').focus(); };
document.querySelector('header h1').onclick = () => go('#/');
$('moreBtn').onclick = () => go('#/more');
$('langBtn').onclick = () => setLang(LANG === 'hi' ? 'en' : 'hi');
$('search').addEventListener('input', e => {
  clearTimeout(stimer); const q = e.target.value.trim();
  if (q.length < 2) { if (searching) { searching = false; route(true); } return; }
  stimer = setTimeout(() => { searching = true; $('view').innerHTML = searchHtml(q); a11y($('view')); $('view').scrollTop = 0; if (isMobile()) $('side').classList.remove('open'); }, 220);
});
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(tx => {
    try {
      const d = JSON.parse(tx); if (!d || typeof d !== 'object' || !d.seen || typeof d.seen !== 'object') throw 0;
      if (confirm(t('This replaces your current progress on this device. Continue?'))) { S = normState(d); S.lang = LANG; save(); document.documentElement.style.setProperty('--fs', S.fs + 'px'); go('#/'); }
    } catch (err) { alert(t('That file is not a valid course backup.')); }
  });
  e.target.value = '';
};
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));
window.addEventListener('hashchange', () => route());
document.documentElement.style.setProperty('--fs', S.fs + 'px');
// text that lives in the page shell (shell.html)
(function shellText() {
  const attr = (id, name, s) => { const e = $(id); if (e) e.setAttribute(name, s); };
  document.querySelector('header h1').textContent = '🕉 ' + t('Marriage Analysis');
  attr('menuBtn', 'aria-label', t('Menu')); attr('srchBtn', 'aria-label', t('Search'));
  attr('pill', 'title', t('Modules complete')); attr('moreBtn', 'aria-label', t('More'));
  const lb = $('langBtn'); lb.textContent = LANG === 'hi' ? 'English' : 'हिंदी'; lb.lang = LANG === 'hi' ? 'en' : 'hi';
  lb.setAttribute('aria-label', LANG === 'hi' ? t('Switch to English') : t('Switch to Hindi')); lb.title = lb.getAttribute('aria-label');
  attr('search', 'placeholder', t('Search the whole course…')); attr('search', 'aria-label', t('Search'));
})();
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
